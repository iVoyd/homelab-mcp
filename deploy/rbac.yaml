# Two ServiceAccounts for homelab-mcp in the job-radar namespace.
#   homelab-mcp-reader: used by the read-only tools (k3s.kubeconfig)
#   homelab-mcp-runner: used only by run_job (actions.kubeconfig)
# For another namespace, copy this file and change every "namespace:".
# Apply with your admin kubeconfig:  sudo k3s kubectl apply -f deploy/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata: {name: homelab-mcp-reader, namespace: job-radar}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: homelab-mcp-reader, namespace: job-radar}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: homelab-mcp-reader, namespace: job-radar}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: homelab-mcp-reader}
subjects:
  - {kind: ServiceAccount, name: homelab-mcp-reader, namespace: job-radar}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: homelab-mcp-reader-token
  namespace: job-radar
  annotations: {kubernetes.io/service-account.name: homelab-mcp-reader}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: homelab-mcp-runner, namespace: job-radar}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: homelab-mcp-runner, namespace: job-radar}
rules:
  # "kubectl create job --from=cronjob/X" reads the CronJob, then creates a Job.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: homelab-mcp-runner, namespace: job-radar}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: homelab-mcp-runner}
subjects:
  - {kind: ServiceAccount, name: homelab-mcp-runner, namespace: job-radar}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: homelab-mcp-runner-token
  namespace: job-radar
  annotations: {kubernetes.io/service-account.name: homelab-mcp-runner}
